<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>災害対応地図</title>

  <!-- Mapbox GL JSのCSS -->
  https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css

  <!-- Mapbox GL JSのJavaScript -->
  https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js</script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    /* 地図を画面全体に表示 */
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    /* 座標表示パネル */
    #coordinate-panel {
      position: absolute;
      left: 10px;
      bottom: 30px;
      z-index: 1;

      padding: 10px 12px;

      background-color: rgba(255, 255, 255, 0.95);
      border: 1px solid #777;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);

      font-family: sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 2つ目の座標欄の上に区切り線を表示 */
    .coordinate-section + .coordinate-section {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <!-- 地図 -->
  <div id="map"></div>

  <!-- 座標表示パネル -->
  <div id="coordinate-panel">

    <div class="coordinate-section">
      <strong>現在地</strong><br>
      緯度：<span id="current-latitude">未取得</span><br>
      経度：<span id="current-longitude">未取得</span>
    </div>

    <div class="coordinate-section">
      <strong>カーソル位置</strong><br>
      緯度：<span id="cursor-latitude">---</span><br>
      経度：<span id="cursor-longitude">---</span>
    </div>

  </div>

  <script>
    // Mapboxアクセストークン
    mapboxgl.accessToken = 'pk.eyJ1IjoiYW1hem9ub2szNTEzIiwiYSI6ImNtb2gwMnYxaDAxdTgycHBvcm5scGQ4YmsifQ.8dFXcVz6apAtaeYug7hrzA';

    // 地図を作成
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [139.7670, 35.6814],
      zoom: 12
    });

    // 現在地表示ボタンを作成
    const geolocateControl = new mapboxgl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true
      },
      trackUserLocation: true,
      showUserLocation: true,
      showAccuracyCircle: true,
      showUserHeading: true
    });

    // 現在地表示ボタンを右上に追加
    map.addControl(
      geolocateControl,
      'top-right'
    );

    // 現在地を取得したときの処理
    geolocateControl.on('geolocate', function (event) {
      const latitude = event.coords.latitude;
      const longitude = event.coords.longitude;

      document.getElementById('current-latitude').textContent =
        latitude.toFixed(6);

      document.getElementById('current-longitude').textContent =
        longitude.toFixed(6);
    });

    // 地図上でマウスを動かしたときの処理
    map.on('mousemove', function (event) {
      const latitude = event.lngLat.lat;
      const longitude = event.lngLat.lng;

      document.getElementById('cursor-latitude').textContent =
        latitude.toFixed(6);

      document.getElementById('cursor-longitude').textContent =
        longitude.toFixed(6);
    });

    // カーソルが地図の外に出たら表示を戻す
    map.getCanvasContainer().addEventListener('mouseleave', function () {
      document.getElementById('cursor-latitude').textContent = '---';
      document.getElementById('cursor-longitude').textContent = '---';
    });
  </script>

</body>

</html>
