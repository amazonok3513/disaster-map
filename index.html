<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>災害対応地図</title>

  <!-- Mapbox GL JSのCSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css"
    rel="stylesheet"
  >

  <!-- Mapbox GL JSのJavaScript -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>

  <!-- 緯度経度をMGRSへ変換するライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/mgrs@2s.min.jsscript>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    /* 地図 */
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    /* 座標表示パネル */
    #coordinate-panel {
      position: absolute;
      left: 10px;
      bottom: 30px;
      z-index: 1;

      min-width: 260px;
      padding: 10px 12px;

      background-color: rgba(255, 255, 255, 0.95);
      border: 1px solid #777;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);

      color: #222;
      font-family: sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }

    #coordinate-panel h2 {
      margin: 0 0 6px;
      font-size: 15px;
    }

    .coordinate-label {
      display: inline-block;
      width: 65px;
      font-weight: bold;
    }

    #location-status {
      margin-top: 5px;
      color: #555;
      font-size: 12px;
    }

    /* スマートフォン表示 */
    @media screen and (max-width: 600px) {
      #coordinate-panel {
        right: 10px;
        bottom: 25px;
        min-width: 0;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- 地図 -->
  <div id="map"></div>

  <!-- 座標表示パネル -->
  <div id="coordinate-panel">
    <h2>現在地座標</h2>

    <div>
      <span class="coordinate-label">緯度</span>
      <span id="latitude">未取得</span>
    </div>

    <div>
      <span class="coordinate-label">経度</span>
      <span id="longitude">未取得</span>
    </div>

    <div>
      <span class="coordinate-label">MGRS</span>
      <span id="mgrs-coordinate">未取得</span>
    </div>

    <div>
      <span class="coordinate-label">GPS精度</span>
      <span id="gps-accuracy">未取得</span>
    </div>

    <div id="location-status">
      右上の現在地ボタンを押してください
    </div>
  </div>

  <script>
    // Mapboxアクセストークン
    mapboxgl.accessToken = 'pk.eyJ1IjoiYW1hem9ub2szNTEzIiwiYSI6ImNtb2gwMnYxaDAxdTgycHBvcm5scGQ4YmsifQ.8dFXcVz6apAtaeYug7hrzA';

    // 地図を作成
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [140.8810, 38.2600],
      zoom: 12
    });

    // 拡大・縮小ボタン
    map.addControl(
      new mapboxgl.NavigationControl(),
      'top-right'
    );

    // 現在地表示コントロール
    const geolocateControl = new mapboxgl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      },

      // 移動に合わせて現在地を更新
      trackUserLocation: true,

      // 現在地の青い点を表示
      showUserLocation: true,

      // GPS精度を円で表示
      showAccuracyCircle: true,

      // 端末が向いている方向を表示
      showUserHeading: true
    });

    // 現在地ボタンを地図右上へ追加
    map.addControl(
      geolocateControl,
      'top-right'
    );

    // 現在地を取得したときの処理
    geolocateControl.on('geolocate', function (event) {

      /*
       * Mapbox GL JSのバージョンによるイベント形式の違いに
       * 対応するため、複数の場所からcoordsを確認します。
       */
      const coords =
        event.coords ||
        event.data?.coords ||
        event.originalEvent?.coords;

      if (!coords) {
        document.getElementById('location-status').textContent =
          '位置情報の取得結果を読み取れませんでした';

        console.error('位置情報イベント:', event);
        return;
      }

      const latitude = coords.latitude;
      const longitude = coords.longitude;
      const accuracy = coords.accuracy;

      // 緯度を小数点以下6桁で表示
      document.getElementById('latitude').textContent =
        latitude.toFixed(6);

      // 経度を小数点以下6桁で表示
      document.getElementById('longitude').textContent =
        longitude.toFixed(6);

      // GPS精度を表示
      if (Number.isFinite(accuracy)) {
        document.getElementById('gps-accuracy').textContent =
          '約 ' + Math.round(accuracy) + ' m';
      } else {
        document.getElementById('gps-accuracy').textContent =
          '不明';
      }

      // 緯度経度をMGRSへ変換
      try {
        const mgrsCoordinate = mgrs.forward(
          [longitude, latitude],
          5
        );

        document.getElementById('mgrs-coordinate').textContent =
          formatMgrs(mgrsCoordinate);

        document.getElementById('location-status').textContent =
          '現在地を取得しました';

      } catch (error) {
        document.getElementById('mgrs-coordinate').textContent =
          '変換エラー';

        document.getElementById('location-status').textContent =
          'MGRS座標へ変換できませんでした';

        console.error('MGRS変換エラー:', error);
      }
    });

    // 位置情報取得エラー
    geolocateControl.on('error', function (error) {
      let message = '現在地を取得できませんでした';

      if (error.code === 1) {
        message = 'ブラウザの位置情報が許可されていません';
      } else if (error.code === 2) {
        message = '現在地を特定できませんでした';
      } else if (error.code === 3) {
        message = '現在地の取得がタイムアウトしました';
      }

      document.getElementById('location-status').textContent =
        message;

      console.error('位置情報取得エラー:', error);
    });

    // MGRSを読みやすく区切る
    function formatMgrs(value) {
      const cleaned = value.replace(/\s/g, '');

      /*
       * 例：
       * 54SUE1234512345
       * ↓
       * 54S UE 12345 12345
       */
      const match = cleaned.match(
        /^(\d{1,2}[C-X])([A-Z]{2})(\d{5})(\d{5})$/
      );

      if (match) {
        return (
          match[1] + ' ' +
          match[2] + ' ' +
          match[3] + ' ' +
          match[4]
        );
      }

      return value;
    }
  </script>

</body>
</html>
